<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración de Usuarios</title>
    
    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/configuracion.css}">
</head>
<body>
    <div class="container">
        <h1>Configuración de Usuarios</h1>
        
        <!-- BOTÓN AGREGAR USUARIO -->
        <button class="btn agregar" onclick="abrirModalAgregar()">
            Agregar Usuario
        </button>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Usuario</th>
                    <th>Fecha ingreso</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="usuario : ${usuarios}">
                    <td th:text="${usuario.idUsuario}"></td>
                    <td th:text="${usuario.username}"></td>
                    <td th:text="${usuario.ingreso}"></td>
                    <td th:text="${usuario.estado}"></td>
                    <td>
                        <button class="btn editar"
                                th:attr="data-id=${usuario.idUsuario}, data-username=${usuario.username}"
                                onclick="abrirModalEditar(this)">
                            Modificar
                        </button>
                        <a th:href="@{/deshabilitar/{id}(id=${usuario.idUsuario})}"
                           class="btn deshabilitar">
                            Deshabilitar
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- BOTÓN VOLVER FIJO -->
    <a th:href="@{/dashboard}" class="volver">
        Volver al Dashboard
    </a>

    <!-- MODAL EDITAR -->
    <div id="modalEditar" class="modal">
        <div class="modal-content">
            <h2>Modificar Usuario</h2>
            <form th:action="@{/actualizar-usuario}" method="post" onsubmit="return validarEditar()"> <!-- ← CORREGIDO -->
                <input type="hidden" id="editId" name="id">
                <label>Nombre Usuario</label>
                <input type="text" id="editUsername" name="username" required>
                
                <label>Nueva Contraseña</label>
                <input type="password" id="editPassword" name="password" required>
                
                <label>Confirmar Contraseña</label>
                <input type="password" id="editConfirmPassword" required>
                
                <button type="submit" class="btn editar">Guardar Cambios</button>
                <button type="button" class="btn deshabilitar" onclick="cerrarModalEditar()">Cancelar</button>
            </form>
        </div>
    </div>

    <!-- MODAL AGREGAR -->
    <div id="modalAgregar" class="modal">
        <div class="modal-content">
            <h2>Agregar Usuario</h2>
            <form th:action="@{/guardar-usuario}" method="post" onsubmit="return validarAgregar()"> <!-- ← CORREGIDO -->
                <label>Nombre Usuario</label>
                <input type="text" name="username" required>
                
                <label>Contraseña</label>
                <input type="password" id="newPassword" name="password" required>
                
                <label>Confirmar Contraseña</label>
                <input type="password" id="confirmNewPassword" required>
                
                <button type="submit" class="btn agregar">Guardar Usuario</button>
                <button type="button" class="btn deshabilitar" onclick="cerrarModalAgregar()">Cancelar</button>
            </form>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="toast"></div>

    <!-- JavaScript -->
    <script th:src="@{/js/configuracion.js}"></script>
</body>
</html>
