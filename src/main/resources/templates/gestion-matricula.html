<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Matrículas - INO</title>
    <link rel="stylesheet" th:href="@{/css/gestion-matriculas.css}">
</head>
<body>

<div class="container">

    <div class="page-header">
        <div>
            <h1>Gestión de Matrículas</h1>
            <p class="subtitle">Administra los registros de estudiantes matriculados</p>
        </div>
        <a th:href="@{/registrar-estudiante}" class="btn btn-nuevo">+ Nuevo Estudiante</a>
    </div>

    <div class="search-bar">
        <input type="text" id="busqueda" placeholder="🔍 Buscar por nombre, NIE o estado..." oninput="filtrarTabla()">
        <span id="contador-resultados" class="contador"></span>
    </div>

    <div class="table-wrapper">
        <table id="tablaMatriculas">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>NIE</th>
                    <th>Nombre completo</th>
                    <th>Estado</th>
                    <th>Correo</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaBody">
                <tr th:each="e : ${estudiantes}"
                    th:data-id="${e.idEstudiante}"
                    th:data-nie="${e.nie}"
                    th:data-nombre="${(e.primerNombre != null ? e.primerNombre : '') + ' ' + (e.primerApellido != null ? e.primerApellido : '')}"
                    th:data-estado="${e.estadoPersona}"
                    th:data-correo="${e.correo}">

                    <td th:text="${e.idEstudiante}"></td>
                    <td th:text="${e.nie != null ? e.nie : '—'}"></td>
                    <td th:text="${(e.primerNombre != null ? e.primerNombre : '') + ' '
                                 + (e.segundoNombre != null ? e.segundoNombre : '') + ' '
                                 + (e.primerApellido != null ? e.primerApellido : '') + ' '
                                 + (e.segundoApellido != null ? e.segundoApellido : '')}">
                    </td>
                    <td>
                        <span th:classappend="${e.estadoPersona == 'Activo' ? 'badge-activa' :
                                               e.estadoPersona == 'Inactivo' ? 'badge-inactiva' : 'badge-pendiente'}"
                              class="badge"
                              th:text="${e.estadoPersona != null ? e.estadoPersona : '—'}">
                        </span>
                    </td>
                    <td th:text="${e.correo != null ? e.correo : '—'}"></td>
                    <td>
                        <div class="acciones">
                            <button class="btn btn-editar" onclick="abrirEdicion(this)">✏️ Editar</button>
                            <button class="btn btn-eliminar" onclick="pedirConfirmacion(this)">🗑 Eliminar</button>
                        </div>
                    </td>
                </tr>

                <!-- Sin registros -->
                <tr th:if="${#lists.isEmpty(estudiantes)}">
                    <td colspan="6" class="estado-vacio">No hay estudiantes registrados.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- MODAL EDICIÓN -->
<div id="modalEdicion" class="modal-overlay" style="display:none;">
    <div class="modal">
        <div class="modal-header">
            <h2>Editar Estudiante</h2>
            <button class="modal-cerrar" onclick="cerrarModal()">✕</button>
        </div>
        <form id="formEdicion" onsubmit="guardarEdicion(event)">
            <input type="hidden" id="edit-id">
            <div class="form-grid">
                <div class="form-group full-width">
                    <label>Nombre completo</label>
                    <input type="text" id="edit-nombre" placeholder="Nombre completo" required>
                </div>
                <div class="form-group">
                    <label>NIE</label>
                    <input type="text" id="edit-nie" placeholder="NIE">
                </div>
                <div class="form-group">
                    <label>Estado</label>
                    <select id="edit-estado">
                        <option value="Activo">Activo</option>
                        <option value="Inactivo">Inactivo</option>
                        <option value="Pendiente">Pendiente</option>
                    </select>
                </div>
                <div class="form-group full-width">
                    <label>Correo electrónico</label>
                    <input type="email" id="edit-correo" placeholder="correo@ejemplo.com">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-cancelar" onclick="cerrarModal()">Cancelar</button>
                <button type="submit" class="btn btn-guardar">Guardar cambios</button>
            </div>
        </form>
    </div>
</div>

<!-- MODAL ELIMINAR -->
<div id="modalEliminar" class="modal-overlay" style="display:none;">
    <div class="modal modal-sm">
        <div class="modal-header">
            <h2>Confirmar eliminación</h2>
            <button class="modal-cerrar" onclick="cerrarModalEliminar()">✕</button>
        </div>
        <div class="modal-body">
            <p>¿Estás seguro de eliminar a <strong id="nombre-a-eliminar"></strong>?</p>
            <p class="aviso">Esta acción no se puede deshacer.</p>
        </div>
        <div class="modal-footer">
            <button class="btn btn-cancelar" onclick="cerrarModalEliminar()">Cancelar</button>
            <button class="btn btn-eliminar" onclick="confirmarEliminar()">Eliminar</button>
        </div>
    </div>
</div>

<!-- TOAST -->
<div id="toast" class="toast" style="display:none;"></div>

<a th:href="@{/dashboard}" class="volver-dashboard">← Dashboard</a>

<script th:src="@{/js/gestion-matriculas.js}"></script>
</body>
</html>
