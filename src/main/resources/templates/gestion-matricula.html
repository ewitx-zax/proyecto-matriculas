<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Matrículas</title>

    <style>
        body{
            font-family: Arial;
            background:#f5f7fa;
            padding:30px;
        }

        .container{
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0px 3px 10px rgba(0,0,0,0.1);
        }

        h1{
            color:#4a6fa5;
            margin-bottom:20px;
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        th{
            background:#e8eef7;
            padding:12px;
        }

        td{
            padding:12px;
            border-bottom:1px solid #ddd;
            text-align:center;
        }

        .btn{
            padding:8px 12px;
            border:none;
            border-radius:6px;
            color:white;
            text-decoration:none;
        }

        .editar{
            background:#4CAF50;
        }

        .eliminar{
            background:#f44336;
        }

        /* BOTÓN FIJO */
        .volver-dashboard{
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #4a6fa5;
            color: white;
            padding: 12px 20px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        .volver-dashboard:hover{
            background: #3b5b8a;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Gestión de Matrículas</h1>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Estudiante</th>
                <th>Grado</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>1</td>
                <td>Juan Pérez</td>
                <td>Tercer Año</td>
                <td>Activa</td>
                <td>
                    <a href="#" class="btn editar">Editar</a>
                    <a href="#" class="btn eliminar">Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>

</div>

<!-- BOTÓN FIJO -->
<a th:href="@{/dashboard}" class="volver-dashboard">
    ← Volver al Dashboard
</a>

</body>
</html>
